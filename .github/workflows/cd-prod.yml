name: CD - Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy'
        required: true
        type: string
  workflow_call:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy'
        required: true
        type: string
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      BOT_APP_ID:
        required: true
      BOT_APP_PASSWORD:
        required: true
      ACR_NAME:
        required: true

permissions:
  id-token: write
  contents: read

env:
  AZURE_RESOURCE_GROUP: rg-aiteammate-prod
  AZURE_LOCATION: japaneast
  ENVIRONMENT: prod
  CONTAINER_APP_NAME: aiteammate-prod-app

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          FEDERATED_TOKEN=$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" | jq -r '.value')
          az login --service-principal \
            --username "${AZURE_CLIENT_ID}" \
            --tenant "${AZURE_TENANT_ID}" \
            --federated-token "${FEDERATED_TOKEN}"
          az account set --subscription "${AZURE_SUBSCRIPTION_ID}"

      - name: Deploy Bicep (Production)
        env:
          BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
          BOT_APP_PASSWORD: ${{ secrets.BOT_APP_PASSWORD }}
        run: |
          az deployment group create \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --template-file TeamsAITeammate/infra/main.bicep \
            --parameters \
              environmentName=prod \
              botAppId="${BOT_APP_ID}" \
              botAppPassword="${BOT_APP_PASSWORD}"

  blue-green-deploy:
    needs: deploy-infra
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          FEDERATED_TOKEN=$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" | jq -r '.value')
          az login --service-principal \
            --username "${AZURE_CLIENT_ID}" \
            --tenant "${AZURE_TENANT_ID}" \
            --federated-token "${FEDERATED_TOKEN}"
          az account set --subscription "${AZURE_SUBSCRIPTION_ID}"

      - name: Deploy new revision (0% traffic)
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/teams-ai-teammate:${{ inputs.image_tag }} \
            --revision-suffix "v-$(echo ${{ inputs.image_tag }} | cut -c1-8)"

      - name: Get new revision name
        id: revision
        run: |
          NEW_REV=$(az containerapp revision list \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "[0].name" -o tsv)
          echo "name=${NEW_REV}" >> $GITHUB_OUTPUT

      - name: Smoke test new revision
        run: |
          FQDN=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          for i in {1..5}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${FQDN}/healthz")
            if [ "$STATUS" = "200" ]; then echo "Healthy"; break; fi
            sleep 10
          done

      - name: Traffic 10%
        run: |
          az containerapp ingress traffic set \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --revision-weight "${{ steps.revision.outputs.name }}=10"
          sleep 60

      - name: Traffic 50%
        run: |
          az containerapp ingress traffic set \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --revision-weight "${{ steps.revision.outputs.name }}=50"
          sleep 60

      - name: Traffic 100%
        run: |
          az containerapp ingress traffic set \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --revision-weight "${{ steps.revision.outputs.name }}=100"

      - name: Deactivate old revisions
        run: |
          OLD_REVS=$(az containerapp revision list \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "[?properties.trafficWeight==\`0\`].name" -o tsv)
          for rev in $OLD_REVS; do
            az containerapp revision deactivate \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --revision "$rev" || true
          done
