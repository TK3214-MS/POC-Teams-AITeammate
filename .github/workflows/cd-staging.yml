name: CD - Staging

on:
  push:
    branches: ['release/**']
  workflow_dispatch:
  workflow_call:
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      STAGING_APP_URL:
        required: true

permissions:
  id-token: write
  contents: read

env:
  AZURE_RESOURCE_GROUP: rg-aiteammate-staging
  AZURE_LOCATION: japaneast
  ENVIRONMENT: staging

jobs:
  full-test-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Build
        run: dotnet build TeamsAITeammate/TeamsAITeammate.slnx -c Release

      - name: Unit Tests
        run: dotnet test TeamsAITeammate/tests/TeamsAITeammate.UnitTests --no-build -c Release --logger trx --results-directory TestResults

      - name: Integration Tests
        run: dotnet test TeamsAITeammate/tests/TeamsAITeammate.IntegrationTests --no-build -c Release --logger trx --results-directory TestResults
        continue-on-error: true

      - name: AI Quality Tests
        run: dotnet test TeamsAITeammate/tests/TeamsAITeammate.AIQualityTests --no-build -c Release --logger trx --results-directory TestResults
        continue-on-error: true

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-staging
          path: TestResults/*.trx

  deploy:
    needs: full-test-suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          FEDERATED_TOKEN=$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" | jq -r '.value')
          az login --service-principal \
            --username "${AZURE_CLIENT_ID}" \
            --tenant "${AZURE_TENANT_ID}" \
            --federated-token "${FEDERATED_TOKEN}"
          az account set --subscription "${AZURE_SUBSCRIPTION_ID}"

      - name: Setup azd
        run: curl --fail --silent --show-error --location https://aka.ms/install-azd.sh | bash

      - name: Deploy with azd
        run: azd deploy --environment ${{ env.ENVIRONMENT }} --no-prompt
        working-directory: TeamsAITeammate
        env:
          AZURE_ENV_NAME: ${{ env.ENVIRONMENT }}
          AZURE_LOCATION: ${{ env.AZURE_LOCATION }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  e2e-tests:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Install Playwright
        run: |
          dotnet build TeamsAITeammate/tests/TeamsAITeammate.E2ETests -c Release
          pwsh TeamsAITeammate/tests/TeamsAITeammate.E2ETests/bin/Release/net10.0/playwright.ps1 install --with-deps

      - name: Run E2E Tests
        run: dotnet test TeamsAITeammate/tests/TeamsAITeammate.E2ETests --no-build -c Release
        env:
          BASE_URL: ${{ secrets.STAGING_APP_URL }}
        continue-on-error: true
